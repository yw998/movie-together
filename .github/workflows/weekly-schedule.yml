name: Daily rolling schedule publication

on:
  schedule:
    - cron: "0 5 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      anchor_date:
        description: "Optional rolling-window start in New York (YYYY-MM-DD)"
        required: false
        type: string
      dry_run:
        description: "Dry run only (no database writes, publication, commit, or deployment)"
        required: true
        default: true
        type: boolean

concurrency:
  group: rolling-schedule-publication
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_DESCRIPTION_MODEL: ${{ vars.OPENAI_DESCRIPTION_MODEL }}
      DESCRIPTION_GENERATION_MODE: cache-only
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare rolling-window paths
        id: context
        shell: bash
        run: |
          ANCHOR="${{ inputs.anchor_date }}"
          if [ -z "$ANCHOR" ]; then
            ANCHOR="$(TZ=America/New_York date +%F)"
          fi
          INFO="$(npm run --silent automation:rolling-info -- "$ANCHOR")"
          RUN_DIR="data/runs/rolling-$ANCHOR/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$RUN_DIR"
          echo "$INFO" > "$RUN_DIR/rolling-context.json"
          echo "anchor=$ANCHOR" >> "$GITHUB_OUTPUT"
          echo "run_dir=$RUN_DIR" >> "$GITHUB_OUTPUT"

      - name: Apply database migrations
        if: ${{ env.DRY_RUN != 'true' }}
        run: npm run db:migrate

      - name: Ingest and review the exact rolling window
        shell: bash
        run: |
          set -euo pipefail
          RUN_DIR="${{ steps.context.outputs.run_dir }}"
          ANCHOR="${{ steps.context.outputs.anchor }}"
          npm run db:export-artifact -- review_bundle "$RUN_DIR/previous-review-bundle.json" --allow-empty
          npm run automation:create-override -- "$ANCHOR" "$RUN_DIR/overrides.json"
          npm run ingest:rolling -- "$ANCHOR" "$RUN_DIR/raw-candidate.json" --continue-on-feed-failure
          npm run reconcile:candidate -- "$RUN_DIR/raw-candidate.json" "$RUN_DIR/previous-review-bundle.json" "$RUN_DIR/candidate.json"
          npm run enrich:descriptions -- "$RUN_DIR/candidate.json" "$RUN_DIR/candidate-enriched.json"
          npm run compile:candidate -- "$RUN_DIR/candidate-enriched.json" "$RUN_DIR/compiled-schedule.json" "$RUN_DIR/review-bundle.json" "$RUN_DIR/overrides.json"
          npm run review:schedule -- "$RUN_DIR/previous-review-bundle.json" "$RUN_DIR/review-bundle.json" "$RUN_DIR/review-report.json" "$RUN_DIR/review-report.md"
          if [ "$DRY_RUN" != "true" ]; then
            npm run auto-approve:schedule -- "$RUN_DIR/review-report.json" "$RUN_DIR/approval.json"
          fi
          cp "$RUN_DIR/compiled-schedule.json" src/data/published-schedule.json

      - name: Verify dry-run rolling candidate
        if: ${{ env.DRY_RUN == 'true' }}
        run: npm run db:verify-rolling -- "${{ steps.context.outputs.run_dir }}/compiled-schedule.json" "${{ steps.context.outputs.anchor }}" "${{ steps.context.outputs.run_dir }}/compiled-schedule.json"

      - name: Run tests
        run: npm test

      - name: Build production site
        run: npm run build

      - name: Import approved rolling window
        if: ${{ env.DRY_RUN != 'true' }}
        run: npm run db:import -- "${{ steps.context.outputs.run_dir }}/candidate-enriched.json" "${{ steps.context.outputs.run_dir }}/compiled-schedule.json" "${{ steps.context.outputs.run_dir }}/review-bundle.json" "${{ steps.context.outputs.run_dir }}/overrides.json" "${{ steps.context.outputs.run_dir }}/review-report.json" "${{ steps.context.outputs.run_dir }}/approval.json"

      - name: Export today plus six days
        if: ${{ env.DRY_RUN != 'true' }}
        run: npm run db:export -- src/data/published-schedule.json "${{ steps.context.outputs.anchor }}"

      - name: Verify rolling database round trip
        if: ${{ env.DRY_RUN != 'true' }}
        run: npm run db:verify-rolling -- src/data/published-schedule.json "${{ steps.context.outputs.anchor }}" "${{ steps.context.outputs.run_dir }}/compiled-schedule.json"

      - name: Verify published watch-mark parents
        if: ${{ env.DRY_RUN != 'true' }}
        run: npm run db:verify-watch-marks -- src/data/published-schedule.json

      - name: Commit validated rolling public data
        if: ${{ env.DRY_RUN != 'true' }}
        shell: bash
        run: |
          if git diff --quiet -- src/data/published-schedule.json; then
            echo "Rolling public JSON is unchanged; no deployment commit is needed."
            exit 0
          fi
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git add src/data/published-schedule.json
          git commit -m "data: publish rolling window ${{ steps.context.outputs.anchor }}"
          git push

      - name: Create cinema availability issue
        if: ${{ env.DRY_RUN != 'true' && success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          REPORT="${{ steps.context.outputs.run_dir }}/review-report.json"
          COUNT="$(jq -r '.summary.unavailableCinemaDates // 0' "$REPORT")"
          if [ "$COUNT" = "0" ]; then exit 0; fi
          BODY="${RUNNER_TEMP}/availability-issue.md"
          {
            echo "## Cinema-date availability notice"
            echo
            echo "$COUNT cinema-date combination(s) had no clean current feed or approved fallback and were omitted. Other verified cinemas were published normally."
            echo
            jq -r '.cinemas[] | select((.unavailableDates | length) > 0) | "- **\(.cinemaId)**: \(.unavailableDates | join(", "))"' "$REPORT"
            echo
            echo "[Open the workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > "$BODY"
          gh issue create --title "Cinema schedule temporarily unavailable: ${{ steps.context.outputs.anchor }}" --body-file "$BODY" --label "schedule-review" || \
          gh issue create --title "Cinema schedule temporarily unavailable: ${{ steps.context.outputs.anchor }}" --body-file "$BODY"

      - name: Upload private review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rolling-${{ steps.context.outputs.anchor }}-${{ github.run_id }}
          path: ${{ steps.context.outputs.run_dir }}
          if-no-files-found: warn
          retention-days: 30

      - name: Create manual-review issue on failure
        if: ${{ failure() && env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          ISSUE_BODY="${RUNNER_TEMP}/schedule-issue.md"
          {
            echo "## Review update: ${{ steps.context.outputs.anchor }}"
            echo
            echo "The daily rolling schedule publication stopped before deployment. The previous production schedule remains active."
            echo
            echo "[Open the workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) to download the private source and review artifacts."
          } > "$ISSUE_BODY"
          gh issue create --title "Rolling schedule review required: ${{ steps.context.outputs.anchor }}" --body-file "$ISSUE_BODY" --label "schedule-review" || \
          gh issue create --title "Rolling schedule review required: ${{ steps.context.outputs.anchor }}" --body-file "$ISSUE_BODY"
