name: Daily rolling schedule publication

on:
  schedule:
    - cron: "0 5 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      anchor_date:
        description: "Optional rolling-window start in New York (YYYY-MM-DD)"
        required: false
        type: string
      dry_run:
        description: "Dry run only (no database writes, publication, commit, or deployment)"
        required: true
        default: true
        type: boolean

concurrency:
  group: rolling-schedule-publication
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_DESCRIPTION_MODEL: ${{ vars.OPENAI_DESCRIPTION_MODEL }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare rolling-window paths
        id: context
        shell: bash
        run: |
          ANCHOR="${{ inputs.anchor_date }}"
          if [ -z "$ANCHOR" ]; then
            ANCHOR="$(TZ=America/New_York date +%F)"
          fi
          INFO="$(npm run --silent automation:rolling-info -- "$ANCHOR")"
          RUN_DIR="data/runs/rolling-$ANCHOR/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$RUN_DIR"
          echo "$INFO" > "$RUN_DIR/rolling-context.json"
          echo "anchor=$ANCHOR" >> "$GITHUB_OUTPUT"
          echo "current_start=$(printf '%s' "$INFO" | jq -r '.weekStarts[0]')" >> "$GITHUB_OUTPUT"
          echo "next_start=$(printf '%s' "$INFO" | jq -r '.weekStarts[1] // ""')" >> "$GITHUB_OUTPUT"
          echo "run_dir=$RUN_DIR" >> "$GITHUB_OUTPUT"

      - name: Apply database migrations
        if: ${{ env.DRY_RUN != 'true' }}
        run: npm run db:migrate

      - name: Ingest and review both calendar weeks
        shell: bash
        run: |
          set -euo pipefail
          RUN_DIR="${{ steps.context.outputs.run_dir }}"
          mapfile -t WEEK_ANCHORS < <(jq -r '.weekAnchors[]' "$RUN_DIR/rolling-context.json")
          for WEEK_ANCHOR in "${WEEK_ANCHORS[@]}"; do
            WEEK_INFO="$(npm run --silent automation:week-info -- "$WEEK_ANCHOR")"
            WINDOW_START="$(printf '%s' "$WEEK_INFO" | jq -r .windowStart)"
            WEEK_DIR="$RUN_DIR/$WINDOW_START"
            mkdir -p "$WEEK_DIR"

            npm run db:export-artifact -- review_bundle "$WEEK_DIR/previous-review-bundle.json" "$WINDOW_START" --allow-empty
            npm run automation:create-override -- "$WEEK_ANCHOR" "$WEEK_DIR/overrides.json"
            npm run ingest:week -- "$WEEK_ANCHOR" "$WEEK_DIR/raw-candidate.json" --continue-on-feed-failure
            npm run reconcile:candidate -- "$WEEK_DIR/raw-candidate.json" "$WEEK_DIR/previous-review-bundle.json" "$WEEK_DIR/candidate.json"
            npm run enrich:descriptions -- "$WEEK_DIR/candidate.json" "$WEEK_DIR/candidate-enriched.json"
            npm run compile:candidate -- "$WEEK_DIR/candidate-enriched.json" "$WEEK_DIR/compiled-schedule.json" "$WEEK_DIR/review-bundle.json" "$WEEK_DIR/overrides.json"
            npm run review:schedule -- "$WEEK_DIR/previous-review-bundle.json" "$WEEK_DIR/review-bundle.json" "$WEEK_DIR/review-report.json" "$WEEK_DIR/review-report.md"
            if [ "$DRY_RUN" != "true" ]; then
              npm run auto-approve:schedule -- "$WEEK_DIR/review-report.json" "$WEEK_DIR/approval.json"
              npm run db:import -- "$WEEK_DIR/candidate-enriched.json" "$WEEK_DIR/compiled-schedule.json" "$WEEK_DIR/review-bundle.json" "$WEEK_DIR/overrides.json" "$WEEK_DIR/review-report.json" "$WEEK_DIR/approval.json"
            fi
          done

      - name: Export today plus six days
        if: ${{ env.DRY_RUN != 'true' }}
        run: npm run db:export -- src/data/published-schedule.json "${{ steps.context.outputs.anchor }}"

      - name: Verify rolling database round trip
        if: ${{ env.DRY_RUN != 'true' }}
        shell: bash
        run: |
          RUN_DIR="${{ steps.context.outputs.run_dir }}"
          mapfile -t WEEK_STARTS < <(jq -r '.weekStarts[]' "$RUN_DIR/rolling-context.json")
          COMPILED=()
          for WINDOW_START in "${WEEK_STARTS[@]}"; do
            COMPILED+=("$RUN_DIR/$WINDOW_START/compiled-schedule.json")
          done
          npm run db:verify-rolling -- src/data/published-schedule.json "${{ steps.context.outputs.anchor }}" "${COMPILED[@]}"

      - name: Assemble and verify dry-run rolling candidate
        if: ${{ env.DRY_RUN == 'true' }}
        shell: bash
        run: |
          RUN_DIR="${{ steps.context.outputs.run_dir }}"
          mapfile -t WEEK_STARTS < <(jq -r '.weekStarts[]' "$RUN_DIR/rolling-context.json")
          COMPILED=()
          for WINDOW_START in "${WEEK_STARTS[@]}"; do
            COMPILED+=("$RUN_DIR/$WINDOW_START/compiled-schedule.json")
          done
          ROLLING="$RUN_DIR/rolling-dry-run.json"
          npm run assemble:rolling-dry-run -- "$ROLLING" "${{ steps.context.outputs.anchor }}" "${COMPILED[@]}"
          npm run db:verify-rolling -- "$ROLLING" "${{ steps.context.outputs.anchor }}" "${COMPILED[@]}"

      - name: Run tests
        run: npm test

      - name: Build production site
        run: npm run build

      - name: Commit validated rolling public data
        if: ${{ env.DRY_RUN != 'true' }}
        shell: bash
        run: |
          if git diff --quiet -- src/data/published-schedule.json; then
            echo "Rolling public JSON is unchanged; no deployment commit is needed."
            exit 0
          fi
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git add src/data/published-schedule.json
          git commit -m "data: publish rolling window ${{ steps.context.outputs.anchor }}"
          git push

      - name: Upload private review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rolling-${{ steps.context.outputs.anchor }}-${{ github.run_id }}
          path: ${{ steps.context.outputs.run_dir }}
          if-no-files-found: warn
          retention-days: 30

      - name: Create manual-review issue on failure
        if: ${{ failure() && env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          ISSUE_BODY="${RUNNER_TEMP}/schedule-issue.md"
          {
            echo "## Review update: ${{ steps.context.outputs.anchor }}"
            echo
            echo "The daily rolling schedule publication stopped before deployment."
            echo
            echo "- Rolling start: ${{ steps.context.outputs.anchor }}"
            echo "- Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Calendar weeks: ${{ steps.context.outputs.current_start }} and ${{ steps.context.outputs.next_start }}"
            echo
            echo "The previous production schedule remains active. [Open the workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) to download the private artifact and source evidence."
            echo
            echo "### Report excerpt"
            find "${{ steps.context.outputs.run_dir }}" -name review-report.md -print0 2>/dev/null | while IFS= read -r -d '' REPORT; do
              if grep -q "HOLD FOR REVIEW" "$REPORT"; then
                sed -n '1,220p' "$REPORT"
              fi
            done
          } > "$ISSUE_BODY"
          EXISTING_ISSUE="$(gh issue list --state open --label schedule-review --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING_ISSUE" ]; then
            gh issue comment "$EXISTING_ISSUE" --body-file "$ISSUE_BODY"
          else
            gh issue create --title "Rolling schedule review required: ${{ steps.context.outputs.anchor }}" --body-file "$ISSUE_BODY" --label "schedule-review" || \
            gh issue create --title "Rolling schedule review required: ${{ steps.context.outputs.anchor }}" --body-file "$ISSUE_BODY"
          fi
